{% load static %}
<nav class="fixed top-0 inset-x-0 z-50 bg-white/90 backdrop-blur border-b border-gray-200">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center">
    <!-- Left: brand + primary -->
    <div class="flex items-center gap-6">
      <a href="{% url 'main:show_main' %}" class="font-extrabold text-gray-900 tracking-tight">
        <span class="text-accent-600">⚽ Labubu</span> Shop
      </a>
      <a href="{% url 'main:show_main' %}" class="text-sm text-gray-700 hover:text-accent-700">
        Home
      </a>
      {% if user.is_authenticated %}
      <!-- This href must match the create URL so main.html intercepts and opens the modal -->
      {% url 'main:create_product' as create_url %}
      <a href="{% url 'main:create_product' %}" data-open-create class="btn btn-success btn-lg rounded-pill">
  <i class="bi bi-plus-circle me-2"></i>Create Product
</a>
      {% endif %}
    </div>

    <!-- Center: search (optional; main.html listens for #global-search) -->
    <div class="mx-auto hidden md:block w-full max-w-md">
      <label class="relative block">
        <span class="sr-only">Search</span>
        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </span>
        <input id="global-search" placeholder="Search products…"
               class="w-full pl-9 pr-3 py-2 rounded-xl border border-gray-300 focus:border-accent-400 focus:ring-accent-400 text-sm"/>
      </label>
    </div>

    <!-- Right: actions -->
    <div class="ml-auto flex items-center gap-2">
      <!-- Navbar Refresh (works via global handler we added) -->
      <button type="button" data-refresh-products
              class="hidden sm:inline-flex items-center gap-2 px-3 py-2 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-50">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 12a9 9 0 1 1-6.219-8.56"/><path d="M21 3v6h-6"/></svg>
        Refresh
      </button>

      {% if user.is_authenticated %}
        <!-- AJAX Logout (handled by base.html's [data-ajax-logout] listener) -->
        <a href="#" data-ajax-logout
           class="inline-flex items-center gap-2 px-3 py-2 rounded-lg border border-red-300 text-red-700 hover:bg-red-50">
          <i class="bi bi-box-arrow-right"></i> Logout
        </a>
        <!-- No-JS fallback -->
        <noscript>
          <form method="post" action="{% url 'main:logout' %}">
            {% csrf_token %}
            <button class="px-3 py-2 rounded-lg border border-red-300 text-red-700">Logout</button>
          </form>
        </noscript>
      {% else %}
        <a href="{% url 'main:login' %}" class="text-sm text-gray-700 hover:text-accent-700">Login</a>
        <a href="{% url 'main:register' %}" class="inline-flex items-center px-3 py-2 rounded-lg bg-accent-600 text-white hover:bg-accent-700 text-sm">
          Register
        </a>
      {% endif %}
    </div>
  </div>
</nav>
