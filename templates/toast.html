<div 
  id="toast-component"
  class="fixed bottom-4 end-4 z-50 opacity-0 translate-y-2 transition-all duration-300
         p-3 px-4 rounded-3 shadow bg-white border border-gray-300 text-body
         d-flex align-items-start gap-2"
  role="status" aria-live="polite" aria-atomic="true"
>
  <div id="toast-icon" class="fs-5">ℹ️</div>
  <div class="min-w-0">
    <div id="toast-title" class="fw-semibold text-truncate">Saved</div>
    <div id="toast-message" class="small text-muted">Your changes have been saved.</div>
  </div>
  <button id="toast-close" type="button" class="btn btn-sm btn-light ms-auto">×</button>
</div>
